<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anri App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">

    <a href="category.html" class="header-back" aria-label="カテゴリーへ戻る">‹</a>

    <div class="header-text">

      <h1 class="header-ja">メインルーム</h1>

      <p class="header-en">Main room</p>

    </div>

    <img src="images/crab.png" class="header-crab">

  </header>

  <main class="main-content">

  <div class="swipe-view">

    <div id="counter" class="photo-counter">0/0</div>

    <div class="scroller">

      <div class="slide">
        <div class="slide-empty">写真準備中</div>
      </div>

    </div>

  </div>

</main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cat = params.get("cat");
    const room = params.get("room");
const backButton = document.querySelector(".header-back");

if (room && backButton) {
  backButton.href = `category.html?room=${room}`;
}

    const categoryTitles = {
      main: {
        ja: "メインルーム",
        en: "Main room"
      },
      kitchen: {
        ja: "キッチン",
        en: "Kitchen"
      },
      vanity: {
        ja: "洗面",
        en: "Vanity"
      },
      bath: {
        ja: "バスルーム",
        en: "Bath"
      },
      toilet: {
        ja: "トイレ",
        en: "Toilet"
      },
      closet: {
        ja: "クローゼット",
        en: "Closet"
      },
      entrance: {
        ja: "玄関",
        en: "Entrance"
      }
    };

    const title = categoryTitles[cat] || categoryTitles.main;

    document.querySelector(".header-ja").textContent = title.ja;
    document.querySelector(".header-en").textContent = title.en;
  </script>
　<script src="app.js"></script>
</body>

</html>
