<script src="language.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const room = params.get("room");
  const languageCodes = {
  ja: "JP",
  en: "EN",
  es: "ES",
  ko: "KO",
  zh: "ZH"
};

const savedLanguage = localStorage.getItem("selectedLanguage") || "ja";
const t = translations[languageCodes[savedLanguage]];
  const list7 = document.querySelector(".category-list-7");
  const list14 = document.querySelector(".category-list-14");

  const fourteenRooms = ["12", "56", "78", "910_54", "910_32"];

  if (fourteenRooms.includes(room)) {

    list7.hidden = true;

    list14.hidden = false;

  } else {

    list7.hidden = false;

    list14.hidden = true;

  }

  const roomPlateIcons = {

    "12": ["images/room-plate-1.png", "images/room-plate-2.png"],

    "56": ["images/room-plate-5.png", "images/room-plate-6.png"],

    "78": ["images/room-plate-7.png", "images/room-plate-8.png"],

    "910_54": ["images/room-plate-9.png", "images/room-plate-10.png"],

    "910_32": ["images/room-plate-9.png", "images/room-plate-10.png"]

  };

  const icons = roomPlateIcons[room];

  const leftIcon = document.querySelector(".top-floating-left");

  const rightIcon = document.querySelector(".top-floating-right");

  if (icons && leftIcon && rightIcon) {

    leftIcon.src = icons[0];

    rightIcon.src = icons[1];
     }
    const categoryKeys = [
  "main",
  "kitchen",
  "vanity",
  "bath",
  "toilet",
  "closet",
  "entrance"
];

document.querySelectorAll(".category-list-7 .room-card").forEach((card, index) => {
  const cat = categoryKeys[index];

  if (room && cat) {
    card.href = `swipe.html?room=${room}&unit=${room}&cat=${cat}`;
  }
});

const roomUnits = {
  "12": ["1", "2"],
  "56": ["5", "6"],
  "78": ["7", "8"],
  "910_54": ["9", "10"],
  "910_32": ["9", "10"]
};

const units = roomUnits[room];
document.querySelectorAll("[data-i18n]").forEach((element) => {
  const key = element.dataset.i18n;
  element.textContent = t[key];
});
if (units) {
  document.querySelectorAll(".category-column-left .room-card").forEach((card, index) => {
    const cat = categoryKeys[index];

    if (cat) {
      card.href = `swipe.html?room=${room}&unit=${units[0]}&cat=${cat}`;
    }
  });

  document.querySelectorAll(".category-column-right .room-card").forEach((card, index) => {
    const cat = categoryKeys[index];

    if (cat) {
      card.href = `swipe.html?room=${room}&unit=${units[1]}&cat=${cat}`;
    }
  });
}
</script>
