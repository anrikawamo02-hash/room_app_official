<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anri App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
　<div class="language-selector">

  <button
    type="button"
    class="language-button"
    aria-label="言語を選択"
    aria-expanded="false"
  >
    <span class="language-icon">🌐</span>
    <span class="language-code">JP</span>
  </button>

  <div class="language-menu" hidden>

    <button type="button" class="language-option" data-lang="ja">
      JP 日本語
    </button>

    <button type="button" class="language-option" data-lang="en">
      EN English
    </button>

    <button type="button" class="language-option" data-lang="es">
      ES Español
    </button>

    <button type="button" class="language-option" data-lang="ko">
      KO 한국어
    </button>

    <button type="button" class="language-option" data-lang="zh">
      ZH 中文
    </button>

  </div>

</div>
  <div class="header-text">

    <h1 class="header-ja">号室選択</h1>

    <p class="header-en">ROOM SELECT</p>

  </div>

  <img src="images/crab.png" class="header-crab">

</header>

  <main class="main-content">
    <a class="card room-card" href="category.html?room=12">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room12-ja">1・2号室</div>

    <div class="room-en" id="room12-en">Rooms 1–2</div>

  </div>
  
  <div class="room-tag">5-2F</div>

</a>
<a class="card room-card" href="category.html?room=3">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room3-ja">3号室</div>

    <div class="room-en">Room 3</div>

  </div>
  
  <div class="room-tag">5-2F</div>

</a>
<a class="card room-card" href="category.html?room=4">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room4-ja">4号室</div>

    <div class="room-en">Room 4</div>

  </div>
  
  <div class="room-tag">5-2F</div>

</a>
<a class="card room-card" href="category.html?room=56">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room56-ja">5・6号室</div>

    <div class="room-en">Rooms 5-6</div>

  </div>
  
  <div class="room-tag">5-2F</div>

</a>
<a class="card room-card" href="category.html?room=78">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room78-ja">7・8号室</div>

    <div class="room-en">Rooms 7-8</div>

  </div>
  
  <div class="room-tag">5-2F</div>

</a>
<a class="card room-card" href="category.html?room=910_54">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room910_54-ja">9・10号室</div>

    <div class="room-en">Rooms 9-10</div>

  </div>
  
  <div class="room-tag">5-4F</div>

</a>
<a class="card room-card" href="category.html?room=910_32">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room910_32-ja">9・10号室</div>

    <div class="room-en">Rooms 9-10</div>

  </div>
  
  <div class="room-tag">3-2F</div>

</a>
<a class="card room-card" href="category.html?room=11">

  <img src="images/room-icon.png" class="room-icon">

  <div class="room-text">

    <div class="room-ja" id="room11-ja">11号室</div>

    <div class="room-en">Room 11</div>

  </div>
  
  <div class="room-tag">3-2F</div>

</a>
  </main>
  <script src="language.js"></script>
<script>
  const languageButton = document.querySelector(".language-button");
  const languageMenu = document.querySelector(".language-menu");
  const languageCode = document.querySelector(".language-code");
  const languageOptions = document.querySelectorAll(".language-option");

  const languageCodes = {
    ja: "JP",
    en: "EN",
    es: "ES",
    ko: "KO",
    zh: "ZH"
  };

  const savedLanguage = localStorage.getItem("selectedLanguage") || "ja";
　const t = translations[languageCodes[savedLanguage]];
　document.querySelector(".header-ja").textContent = t.roomSelect;
　document.getElementById("room12-ja").textContent = t.room12;
　document.getElementById("room3-ja").textContent = t.room3;
　document.getElementById("room4-ja").textContent = t.room4;
　document.getElementById("room56-ja").textContent = t.room56;
　document.getElementById("room78-ja").textContent = t.room78;
　document.getElementById("room910_54-ja").textContent = t.room910_54;
　document.getElementById("room910_32-ja").textContent = t.room910_32;
　document.getElementById("room11-ja").textContent = t.room11;
　document.querySelector(".header-ja").classList.toggle("header-ja-es", savedLanguage === "es");
  languageCode.textContent = languageCodes[savedLanguage];

  languageButton.addEventListener("click", () => {
    const isOpen = !languageMenu.hidden;

    languageMenu.hidden = isOpen;
    languageButton.setAttribute("aria-expanded", String(!isOpen));
  });

  languageOptions.forEach((option) => {
    option.addEventListener("click", () => {
      const selectedLanguage = option.dataset.lang;

      languageCode.textContent = languageCodes[selectedLanguage];

      localStorage.setItem("selectedLanguage", selectedLanguage);

　　　　const t = translations[languageCodes[selectedLanguage]];
　　　　document.querySelector(".header-ja").textContent = t.roomSelect;
　　　　document.getElementById("room12-ja").textContent = t.room12;
　　　　document.getElementById("room3-ja").textContent = t.room3;
　　　　document.getElementById("room4-ja").textContent = t.room4;
　　　　document.getElementById("room56-ja").textContent = t.room56;
　　　　document.getElementById("room78-ja").textContent = t.room78;
　　　　document.getElementById("room910_54-ja").textContent = t.room910_54;
　　　　document.getElementById("room910_32-ja").textContent = t.room910_32;
　　　　document.getElementById("room11-ja").textContent = t.room11;
　　　　document.querySelector(".header-ja").classList.toggle("header-ja-es", selectedLanguage === "es");
      languageMenu.hidden = true;
      languageButton.setAttribute("aria-expanded", "false");
    });
  });
</script>
</body>

</html>
